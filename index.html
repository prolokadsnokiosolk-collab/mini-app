<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КЕНЛИТ АВТО</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Montserrat', -apple-system, sans-serif;
      background: linear-gradient(135deg, #2c2c2c 0%, #1a1a1a 50%, #0d0d0d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .screen {
      text-align: center;
      max-width: 400px;
      padding: 40px 30px;
      background: linear-gradient(135deg, rgba(139,128,107,.15) 0%, rgba(95,87,73,.1) 100%);
      border-radius: 24px;
      border: 1px solid rgba(218,197,164,.2);
      backdrop-filter: blur(10px);
    }

    .icon { font-size: 64px; margin-bottom: 20px; }

    .title {
      font-size: 24px;
      font-weight: 700;
      color: #dac5a4;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .text {
      font-size: 14px;
      color: rgba(218,197,164,.7);
      line-height: 1.6;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(218,197,164,.3);
      border-top-color: #dac5a4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="content" class="screen">
    <div class="icon">⏳</div>
    <div class="title">Загрузка</div>
    <div class="text">
      Проверка доступа<span class="loading"></span>
    </div>
  </div>
