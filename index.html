<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ТЕСТ ОТПРАВКИ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background: #000;
      color: #0f0;
      padding: 20px;
      font-family: monospace;
      font-size: 16px;
    }
    .btn {
      background: #4CAF50;
      color: white;
      padding: 20px 40px;
      border: none;
      border-radius: 10px;
      font-size: 20px;
      margin: 10px;
      cursor: pointer;
      width: 100%;
    }
    .log {
      background: #222;
      padding: 10px;
      margin: 10px 0;
      border-left: 3px solid #0f0;
    }
  </style>
</head>
<body>
  
  <h1>🧪 ТЕСТ ОТПРАВКИ ДАННЫХ</h1>
  <div id="log"></div>
  
  <button class="btn" onclick="testSend()">📤 ОТПРАВИТЬ ТЕСТОВЫЕ ДАННЫЕ</button>
  
  <script>
    var tg = window.Telegram.WebApp;
    var logDiv = document.getElementById('log');
    
    function addLog(msg) {
      var p = document.createElement('div');
      p.className = 'log';
      p.innerHTML = msg;
      logDiv.appendChild(p);
    }
    
    tg.ready();
    tg.expand();
    
    addLog('✅ 1. WebApp инициализирован');
    addLog('✅ 2. Версия: ' + (tg.version || 'неизвестно'));
    addLog('✅ 3. Platform: ' + (tg.platform || 'неизвестно'));
    
    // Показываем MainButton
    tg.MainButton.setText('📤 ОТПРАВИТЬ ЧЕРЕЗ MAINBUTTON');
    tg.MainButton.color = '#4CAF50';
    tg.MainButton.textColor = '#FFFFFF';
    tg.MainButton.show();
    
    addLog('✅ 4. MainButton показан');
    
    // Обработчик MainButton
    tg.MainButton.onClick(function(){
      addLog('🎯 5. MainButton НАЖАТ!');
      sendData();
    });
    
    addLog('✅ 6. Обработчик установлен');
    
    function testSend() {
      addLog('🎯 Кнопка "ОТПРАВИТЬ" нажата!');
      sendData();
    }
    
    function sendData() {
      var testData = {
        contract_type: 'sale',
        seller_type: 'company',
        fio: 'Тестов Тест Тестович',
        phone: '123-456',
        auto: 'Test Car',
        vin: 'TEST12345678901XX',
        base_price: 500000,
        akpp_price: 0,
        full_price: 500000,
        down_payment: 250000,
        loan_body: 250000,
        rate_percent: 0,
        interest_sum: 0,
        has_discount: false,
        discount_amount: 0,
        total_debt: 250000,
        weeks: 1,
        weekly_payment: 250000
      };
      
      var jsonString = JSON.stringify(testData);
      
      addLog('📦 Данные подготовлены:');
      addLog('Размер: ' + jsonString.length + ' символов');
      addLog('Первые 100 символов: ' + jsonString.substring(0, 100));
      
      try {
        addLog('⏳ Вызываем tg.sendData()...');
        tg.sendData(jsonString);
        addLog('✅ tg.sendData() выполнен БЕЗ ОШИБОК!');
      } catch(e) {
        addLog('❌ ОШИБКА при sendData: ' + e.message);
      }
    }
  </script>
  
</body>
</html>
