<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КЕНЛИТ АВТО - Диагностика</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background: #000;
      color: #fff;
      padding: 20px;
      font-family: monospace;
      font-size: 14px;
    }
    h1 {
      color: #4CAF50;
      margin-bottom: 20px;
    }
    p {
      margin: 10px 0;
      padding: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 5px;
    }
    .success {
      color: #4CAF50;
    }
    .error {
      color: #f44336;
    }
    .warning {
      color: #ff9800;
    }
    hr {
      margin: 20px 0;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  
  <h1>🔍 ДИАГНОСТИКА TELEGRAM WEBAPP</h1>
  <div id="debug"></div>
  
  <script>
    var debug = document.getElementById('debug');
    
    function log(msg, type) {
      var className = type || 'success';
      debug.innerHTML += '<p class="' + className + '">' + msg + '</p>';
    }
    
    log('1. HTML загружен ✅', 'success');
    log('2. JavaScript работает ✅', 'success');
    
    // Проверка Telegram объекта
    if (typeof window.Telegram === 'undefined') {
      log('3. ❌ ОШИБКА: window.Telegram не найден!', 'error');
      log('Скрипт telegram-web-app.js не загрузился!', 'error');
    } else {
      log('3. window.Telegram найден ✅', 'success');
    }
    
    // Проверка WebApp
    if (typeof window.Telegram !== 'undefined' && window.Telegram.WebApp) {
      var tg = window.Telegram.WebApp;
      log('4. Telegram.WebApp доступен ✅', 'success');
      
      // Вызов ready
      try {
        tg.ready();
        log('5. tg.ready() выполнен ✅', 'success');
      } catch(e) {
        log('5. ❌ tg.ready() ошибка: ' + e.message, 'error');
      }
      
      // Вызов expand
      try {
        tg.expand();
        log('6. tg.expand() выполнен ✅', 'success');
      } catch(e) {
        log('6. ❌ tg.expand() ошибка: ' + e.message, 'error');
      }
      
      // Информация о версии
      log('7. Версия WebApp: ' + (tg.version || 'неизвестно'), 'warning');
      log('8. Платформа: ' + (tg.platform || 'неизвестно'), 'warning');
      log('9. initData: ' + (tg.initData ? 'есть' : 'нет'), 'warning');
      
      // Проверка MainButton
      if (typeof tg.MainButton === 'undefined') {
        log('10. ❌ КРИТИЧНО: tg.MainButton не существует!', 'error');
        log('Ваша версия Telegram WebApp устарела!', 'error');
      } else {
        log('10. tg.MainButton существует ✅', 'success');
        
        // Установка текста
        try {
          tg.MainButton.setText('🧪 ТЕСТОВАЯ КНОПКА');
          log('11. MainButton.setText() работает ✅', 'success');
        } catch(e) {
          log('11. ❌ setText ошибка: ' + e.message, 'error');
        }
        
        // Установка цвета
        try {
          tg.MainButton.color = '#4CAF50';
          tg.MainButton.textColor = '#FFFFFF';
          log('12. Цвета кнопки установлены ✅', 'success');
        } catch(e) {
          log('12. ⚠️ Цвета не установлены: ' + e.message, 'warning');
        }
        
        // Показ кнопки
        try {
          tg.MainButton.show();
          log('13. MainButton.show() вызван ✅', 'success');
          log('Кнопка должна появиться внизу экрана!', 'warning');
        } catch(e) {
          log('13. ❌ show() ошибка: ' + e.message, 'error');
        }
        
        // Установка обработчика
        try {
          tg.MainButton.onClick(function(){
            log('🎉🎉🎉 КНОПКА НАЖАТА! ВСЁ РАБОТАЕТ! 🎉🎉🎉', 'success');
            tg.showAlert('✅ Кнопка работает идеально!');
          });
          log('14. onClick обработчик установлен ✅', 'success');
        } catch(e) {
          log('14. ❌ onClick ошибка: ' + e.message, 'error');
        }
      }
      
      log('', '');
      log('═══════════════════════════════', 'warning');
      log('НАЖМИТЕ ЗЕЛЁНУЮ КНОПКУ ВНИЗУ!', 'warning');
      log('═══════════════════════════════', 'warning');
      
    } else {
      log('4. ❌ КРИТИЧЕСКАЯ ОШИБКА: Telegram.WebApp недоступен!', 'error');
      log('Приложение не открыто в Telegram!', 'error');
    }
    
    // Дополнительная информация
    log('', '');
    log('--- Дополнительная информация ---', 'warning');
    log('User Agent: ' + navigator.userAgent.substring(0, 50) + '...', 'warning');
    log('Ширина экрана: ' + window.innerWidth + 'px', 'warning');
    log('Высота экрана: ' + window.innerHeight + 'px', 'warning');
    
  </script>
  
</body>
</html>
