<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КЕНЛИТ АВТО</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background: #111827;
      color: #f9fafb;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    h1 {
      text-align: center;
      color: #facc15;
      margin-bottom: 24px;
    }
    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 4px;
      font-weight: 600;
      color: #e5e7eb;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #4b5563;
      background: #020617;
      color: #f9fafb;
      font-size: 15px;
    }
    input::placeholder {
      color: #6b7280;
    }
  </style>
</head>
<body>
  <h1>🚗 КЕНЛИТ АВТО</h1>

  <label>ФИО клиента</label>
  <input id="fio" type="text" placeholder="Иванов Иван Иванович">

  <label>Телефон (333-333)</label>
  <input id="phone" type="text" maxlength="7" placeholder="333-333">

  <label>Марка авто</label>
  <input id="auto" type="text" placeholder="Toyota Camry">

  <label>VIN (17 символов)</label>
  <input id="vin" type="text" maxlength="17" placeholder="WVWZZZ1KZBW123456">

  <label>Цена</label>
  <input id="price" type="number" value="500000">

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    tg.MainButton.setText('✅ ОТПРАВИТЬ ДАННЫЕ');
    tg.MainButton.color = '#facc15';
    tg.MainButton.textColor = '#111827';
    tg.MainButton.show();

    tg.MainButton.onClick(function () {
      const fio   = document.getElementById('fio').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const auto  = document.getElementById('auto').value.trim();
      const vin   = document.getElementById('vin').value.trim().toUpperCase();
      const price = parseFloat(document.getElementById('price').value || '0');

      if (!fio || !phone || !auto || vin.length !== 17 || !price || price <= 0) {
        tg.showAlert('❌ Заполните все поля.\nТелефон: 333-333\nVIN: 17 символов.');
        return;
      }
      if (!phone.includes('-')) {
        tg.showAlert('❌ Телефон в формате 333-333.');
        return;
      }

      const data =
        'fio='   + encodeURIComponent(fio)   +
        '&phone='+ encodeURIComponent(phone) +
        '&auto=' + encodeURIComponent(auto)  +
        '&vin='  + encodeURIComponent(vin)   +
        '&price='+ price;

      // ПРЯМО В ТВОЙ БОТ @KENLIT_bot
      tg.showAlert('✅ Данные отправлены в бот.');
      window.location.href = 'https://t.me/KENLIT_bot?start=app_' + data;
    });
  </script>
</body>
</html>
