<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Форма</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      font-family: Arial;
    }
    input {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }
    h2 { text-align: center; }
  </style>
</head>
<body>
  
  <h2>📝 Заполните форму</h2>
  
  <input type="text" id="fio" placeholder="ФИО">
  <input type="text" id="phone" placeholder="Телефон (123-456)">
  <input type="number" id="price" placeholder="Цена" value="500000">
  
  <script>
    var tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    tg.MainButton.setText('ОТПРАВИТЬ');
    tg.MainButton.color = '#5b9bd5';
    tg.MainButton.show();
    
    tg.MainButton.onClick(function(){
      var fio = document.getElementById('fio').value.trim();
      var phone = document.getElementById('phone').value.trim();
      var price = document.getElementById('price').value;
      
      if (!fio || !phone || !price) {
        tg.showAlert('❌ Заполните все поля!');
        return;
      }
      
      // Создаём данные
      var data = {
        fio: fio,
        phone: phone,
        price: parseFloat(price)
      };
      
      // ОТПРАВЛЯЕМ ДАННЫЕ
      tg.sendData(JSON.stringify(data));
    });
  </script>
  
</body>
</html>
