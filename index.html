<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оформление договора</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            color: #1a1a1a;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 14px center;
            padding-right: 40px;
        }

        /* НОВЫЕ СТИЛИ ДЛЯ ВЫБОРА ПРОДАВЦА */
        .seller-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .seller-btn {
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            transition: all 0.3s;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .seller-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .seller-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .seller-btn .icon {
            font-size: 28px;
        }

        .seller-btn .text {
            font-size: 13px;
            line-height: 1.3;
        }

        .week-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .week-btn {
            padding: 14px 10px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .week-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .week-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .week-btn .weeks {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .week-btn .rate {
            font-size: 12px;
            color: #666;
        }

        .week-btn.active .rate {
            color: rgba(255, 255, 255, 0.9);
        }

        .price-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .price-row.total {
            font-weight: 700;
            font-size: 18px;
            padding-top: 15px;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            margin-top: 10px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            padding: 16px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border-radius: 12px;
            color: white;
            font-weight: 600;
        }

        .checkbox-group input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            color: white;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            .week-selector {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .seller-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">📝</div>
            <h1>Оформление договора</h1>
        </div>
        
        <form id="contractForm">
            <!-- Тип договора -->
            <div class="input-group">
                <label for="contract_type">Тип договора</label>
                <select id="contract_type" required>
                    <option value="">Выберите тип</option>
                    <option value="Комиссия">Комиссия</option>
                    <option value="Купля-продажа">Купля-продажа</option>
                </select>
            </div>

            <!-- НОВОЕ: Выбор продавца (показывается только для купли-продажи) -->
            <div class="input-group" id="seller_type_group" style="display:none;">
                <label>Кто продает?</label>
                <div class="seller-buttons">
                    <button type="button" class="seller-btn" data-value="company">
                        <div class="icon">🏢</div>
                        <div class="text">ООО КЕНЛИТ АВТО<br>продает</div>
                    </button>
                    <button type="button" class="seller-btn" data-value="citizen">
                        <div class="icon">👤</div>
                        <div class="text">Гражданин<br>продает</div>
                    </button>
                </div>
                <input type="hidden" id="seller_type" value="">
            </div>

            <!-- ФИО -->
            <div class="input-group">
                <label for="fio">ФИО (полностью)</label>
                <input type="text" id="fio" placeholder="Иванов Иван Иванович" required>
            </div>

            <!-- Паспорт -->
            <div class="input-group">
                <label for="passport">Паспорт (серия номер)</label>
                <input type="text" id="passport" placeholder="2003 123456" required>
            </div>

            <!-- Адрес -->
            <div class="input-group">
                <label for="address">Адрес регистрации</label>
                <input type="text" id="address" placeholder="г. Москва, ул. Ленина, д. 1" required>
            </div>

            <!-- Телефон -->
            <div class="input-group">
                <label for="phone">Телефон</label>
                <input type="tel" id="phone" placeholder="+7 (999) 123-45-67" required>
            </div>

            <!-- Автомобиль -->
            <div class="input-group">
                <label for="auto">Автомобиль (Марка Модель)</label>
                <input type="text" id="auto" placeholder="BMW X5" required>
            </div>

            <!-- VIN -->
            <div class="input-group">
                <label for="vin">VIN номер</label>
                <input type="text" id="vin" placeholder="WBAXXX1234567890" required>
            </div>

            <!-- Год выпуска -->
            <div class="input-group">
                <label for="year">Год выпуска</label>
                <input type="number" id="year" placeholder="2023" min="1990" max="2025" required>
            </div>

            <!-- Цвет -->
            <div class="input-group">
                <label for="color">Цвет кузова</label>
                <input type="text" id="color" placeholder="Черный" required>
            </div>

            <!-- Базовая цена -->
            <div class="input-group">
                <label for="base_price">Базовая цена (₽)</label>
                <input type="number" id="base_price" placeholder="2000000" step="1000" required>
            </div>

            <!-- АКПП -->
            <div class="input-group">
                <label for="akpp_price">Доплата за АКПП (₽)</label>
                <select id="akpp_price">
                    <option value="0">Не установлена</option>
                    <option value="100000">Вариант 1: +100 000 ₽</option>
                    <option value="250000">Вариант 2: +250 000 ₽</option>
                </select>
            </div>

            <!-- Новогодняя акция -->
            <div class="checkbox-group">
                <input type="checkbox" id="has_discount">
                <label for="has_discount">🎄 Новогодняя акция -26%</label>
            </div>

            <!-- Срок рассрочки -->
            <div class="input-group">
                <label>Срок рассрочки (недели)</label>
                <div class="week-selector">
                    <button type="button" class="week-btn" data-weeks="1">
                        <div class="weeks">1 неделя</div>
                        <div class="rate">0%</div>
                    </button>
                    <button type="button" class="week-btn" data-weeks="2">
                        <div class="weeks">2 недели</div>
                        <div class="rate">5%</div>
                    </button>
                    <button type="button" class="week-btn" data-weeks="3">
                        <div class="weeks">3 недели</div>
                        <div class="rate">10%</div>
                    </button>
                    <button type="button" class="week-btn" data-weeks="4">
                        <div class="weeks">4 недели</div>
                        <div class="rate">15%</div>
                    </button>
                    <button type="button" class="week-btn" data-weeks="5">
                        <div class="weeks">5 недель</div>
                        <div class="rate">20%</div>
                    </button>
                    <button type="button" class="week-btn" data-weeks="6">
                        <div class="weeks">6 недель</div>
                        <div class="rate">25%</div>
                    </button>
                </div>
                <input type="hidden" id="weeks" value="">
            </div>

            <!-- Итого -->
            <div class="price-info" id="priceInfo" style="display:none;">
                <div class="price-row">
                    <span>Базовая цена:</span>
                    <span id="display_base">0 ₽</span>
                </div>
                <div class="price-row">
                    <span>Доплата АКПП:</span>
                    <span id="display_akpp">0 ₽</span>
                </div>
                <div class="price-row">
                    <span>Полная стоимость:</span>
                    <span id="display_full">0 ₽</span>
                </div>
                <div class="price-row" id="discount_row" style="display:none;">
                    <span>Скидка -26%:</span>
                    <span id="display_discount" style="color: #10b981;">0 ₽</span>
                </div>
                <div class="price-row">
                    <span>Первый взнос (50%):</span>
                    <span id="display_down">0 ₽</span>
                </div>
                <div class="price-row">
                    <span>Остаток в рассрочку:</span>
                    <span id="display_loan">0 ₽</span>
                </div>
                <div class="price-row">
                    <span>Процентная ставка:</span>
                    <span id="display_rate">0%</span>
                </div>
                <div class="price-row">
                    <span>Сумма процентов:</span>
                    <span id="display_interest">0 ₽</span>
                </div>
                <div class="price-row total">
                    <span>Итого к оплате:</span>
                    <span id="display_total">0 ₽</span>
                </div>
                <div class="price-row total">
                    <span>Еженедельный платеж:</span>
                    <span id="display_weekly">0 ₽</span>
                </div>
            </div>
        </form>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const rates = {1: 0, 2: 5, 3: 10, 4: 15, 5: 20, 6: 25};
        let selectedWeeks = null;

        // НОВОЕ: Показать/скрыть выбор продавца
        document.getElementById('contract_type').addEventListener('change', function() {
            const sellerGroup = document.getElementById('seller_type_group');
            if (this.value === 'Купля-продажа') {
                sellerGroup.style.display = 'block';
            } else {
                sellerGroup.style.display = 'none';
                document.getElementById('seller_type').value = '';
                document.querySelectorAll('.seller-btn').forEach(btn => btn.classList.remove('active'));
            }
        });

        // НОВОЕ: Обработка кнопок выбора продавца
        document.querySelectorAll('.seller-btn').forEach(button => {
            button.addEventListener('click', function() {
                document.querySelectorAll('.seller-btn').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('seller_type').value = this.dataset.value;
            });
        });

        // Выбор недель
        document.querySelectorAll('.week-btn').forEach(button => {
            button.addEventListener('click', function() {
                document.querySelectorAll('.week-btn').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                selectedWeeks = parseInt(this.dataset.weeks);
                document.getElementById('weeks').value = selectedWeeks;
                calculate();
            });
        });

        // Пересчет при изменении полей
        document.getElementById('base_price').addEventListener('input', calculate);
        document.getElementById('akpp_price').addEventListener('change', calculate);
        document.getElementById('has_discount').addEventListener('change', calculate);

        function calculate() {
            if (!selectedWeeks) return;

            const basePrice = parseFloat(document.getElementById('base_price').value) || 0;
            const akppPrice = parseFloat(document.getElementById('akpp_price').value) || 0;
            const hasDiscount = document.getElementById('has_discount').checked;

            let fullPrice = basePrice + akppPrice;
            let discountAmount = 0;

            if (hasDiscount) {
                discountAmount = Math.round(fullPrice * 0.26);
                fullPrice -= discountAmount;
            }

            const downPayment = Math.round(fullPrice * 0.5);
            const loanBody = fullPrice - downPayment;
            const ratePercent = rates[selectedWeeks];
            const interestSum = Math.round(loanBody * (ratePercent / 100));
            const totalDebt = loanBody + interestSum;
            const weeklyPayment = Math.round(totalDebt / selectedWeeks);

            // Отображение
            document.getElementById('display_base').textContent = formatPrice(basePrice);
            document.getElementById('display_akpp').textContent = formatPrice(akppPrice);
            document.getElementById('display_full').textContent = formatPrice(fullPrice);
            document.getElementById('display_down').textContent = formatPrice(downPayment);
            document.getElementById('display_loan').textContent = formatPrice(loanBody);
            document.getElementById('display_rate').textContent = ratePercent + '%';
            document.getElementById('display_interest').textContent = formatPrice(interestSum);
            document.getElementById('display_total').textContent = formatPrice(totalDebt);
            document.getElementById('display_weekly').textContent = formatPrice(weeklyPayment);

            if (hasDiscount) {
                document.getElementById('discount_row').style.display = 'flex';
                document.getElementById('display_discount').textContent = '-' + formatPrice(discountAmount);
            } else {
                document.getElementById('discount_row').style.display = 'none';
            }

            document.getElementById('priceInfo').style.display = 'block';
        }

        function formatPrice(num) {
            return new Intl.NumberFormat('ru-RU').format(num) + ' ₽';
        }

        // Кнопка "Отправить"
        tg.MainButton.setText('Отправить данные');
        tg.MainButton.show();
        tg.MainButton.onClick(function() {
            const contractType = document.getElementById('contract_type').value;
            const sellerType = document.getElementById('seller_type').value;

            // НОВОЕ: Проверка для купли-продажи
            if (contractType === 'Купля-продажа' && !sellerType) {
                tg.showAlert('⚠️ Выберите, кто является продавцом!');
                return;
            }

            if (!selectedWeeks) {
                tg.showAlert('⚠️ Выберите срок рассрочки!');
                return;
            }

            const basePrice = parseFloat(document.getElementById('base_price').value) || 0;
            const akppPrice = parseFloat(document.getElementById('akpp_price').value) || 0;
            const hasDiscount = document.getElementById('has_discount').checked;

            let fullPrice = basePrice + akppPrice;
            let discountAmount = 0;

            if (hasDiscount) {
                discountAmount = Math.round(fullPrice * 0.26);
                fullPrice -= discountAmount;
            }

            const downPayment = Math.round(fullPrice * 0.5);
            const loanBody = fullPrice - downPayment;
            const ratePercent = rates[selectedWeeks];
            const interestSum = Math.round(loanBody * (ratePercent / 100));
            const totalDebt = loanBody + interestSum;
            const weeklyPayment = Math.round(totalDebt / selectedWeeks);

            const data = {
                contract_type: contractType,
                seller_type: sellerType || 'citizen',  // НОВОЕ ПОЛЕ
                fio: document.getElementById('fio').value,
                passport: document.getElementById('passport').value,
                address: document.getElementById('address').value,
                phone: document.getElementById('phone').value,
                auto: document.getElementById('auto').value,
                vin: document.getElementById('vin').value,
                year: document.getElementById('year').value,
                color: document.getElementById('color').value,
                base_price: basePrice,
                akpp_price: akppPrice,
                full_price: fullPrice,
                down_payment: downPayment,
                loan_body: loanBody,
                rate_percent: ratePercent,
                interest_sum: interestSum,
                has_discount: hasDiscount,
                discount_amount: discountAmount,
                weeks: selectedWeeks,
                total_debt: totalDebt,
                weekly_payment: weeklyPayment
            };

            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
