<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КЕНЛИТ АВТО</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { 
      background: linear-gradient(135deg, #2c2c2c 0%, #1a1a1a 100%); 
      color: #fff; 
      padding: 20px; 
      font-family: Arial; 
    }
    input { 
      width: 100%; 
      padding: 15px; 
      margin: 10px 0; 
      border: 1px solid #dac5a4; 
      border-radius: 8px; 
      background: #16213e; 
      color: #fff; 
      font-size: 16px; 
    }
    label { 
      font-weight: bold; 
      color: #dac5a4; 
      margin-bottom: 5px; 
      display: block; 
    }
    h1 { 
      text-align: center; 
      color: #dac5a4; 
      margin-bottom: 30px; 
    }
  </style>
</head>
<body>
  <h1>🚗 КЕНЛИТ АВТО</h1>
  
  <div>
    <label>ФИО клиента:</label>
    <input type="text" id="fio" placeholder="Иванов Иван Иванович">
  </div>
  
  <div>
    <label>Телефон (333-333):</label>
    <input type="text" id="phone" placeholder="333-333" maxlength="7">
  </div>
  
  <div>
    <label>Марка авто:</label>
    <input type="text" id="auto" placeholder="Toyota Camry">
  </div>
  
  <div>
    <label>VIN (17 символов):</label>
    <input type="text" id="vin" placeholder="WVWZZZ1KZBW123456" maxlength="17">
  </div>
  
  <div>
    <label>Базовая цена:</label>
    <input type="number" id="price" placeholder="500000" value="500000">
  </div>
  
  <script>
    var tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    tg.MainButton.setText('✅ ОТПРАВИТЬ ДАННЫЕ');
    tg.MainButton.color = '#dac5a4';
    tg.MainButton.textColor = '#1a1a1a';
    tg.MainButton.show();
    
    tg.MainButton.onClick(function(){
      var fio = document.getElementById('fio').value.trim();
      var phone = document.getElementById('phone').value.trim();
      var auto = document.getElementById('auto').value.trim();
      var vin = document.getElementById('vin').value.trim().toUpperCase();
      var price = parseFloat(document.getElementById('price').value);
      
      if(!fio || !phone || !auto || vin.length !== 17 || !price || price <= 0) {
        tg.showAlert('❌ Заполните все поля правильно!\nVIN: 17 символов\nТелефон: 333-333');
        return;
      }
      
      if(!phone.includes('-')) {
        tg.showAlert('❌ Телефон: формат 333-333');
        return;
      }
      
      // Формируем данные для бота
      var data = `fio=${encodeURIComponent(fio)}&phone=${encodeURIComponent(phone)}&auto=${encodeURIComponent(auto)}&vin=${vin}&price=${price}`;
      
      // ОТПРАВЛЯЕМ В @KENLIT_bot
      tg.showAlert('✅ Данные отправлены!');
      window.location.href = `https://t.me/KENLIT_bot?start=app_${data}`;
    });
  </script>
</body>
</html>
