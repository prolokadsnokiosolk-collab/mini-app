<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ФИНАЛЬНЫЙ ТЕСТ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
      font-family: 'Segoe UI', sans-serif;
    }
    h1 {
      color: #0f3460;
      text-align: center;
      margin-bottom: 20px;
    }
    .log {
      background: #16213e;
      border-left: 4px solid #0f3460;
      padding: 12px;
      margin: 8px 0;
      border-radius: 5px;
      font-size: 13px;
      word-wrap: break-word;
    }
    .success { border-left-color: #4caf50; }
    .error { border-left-color: #f44336; }
    .warning { border-left-color: #ff9800; }
    input {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: 2px solid #0f3460;
      border-radius: 8px;
      font-size: 16px;
      background: #16213e;
      color: #eee;
    }
    input:focus {
      outline: none;
      border-color: #4caf50;
    }
  </style>
</head>

  <div id="logs"></div>

  <input type="text" id="phone" placeholder="Телефон" value="123-456">
  <input type="number" id="price" placeholder="Цена" value="500000">

    var logsDiv = document.getElementById('logs');

      logsDiv.appendChild(div);
      console.log(msg);
    }
